name: Verify ICS all-day fix
on:
  push:
    branches: [fix/ics-all-day-only]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original plus all-day tests
        run: npm test && node tests/all-day.test.js
      - name: Install Pebble SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/uv tool install --python 3.12 pebble-tool
          pebble sdk install latest
      - name: Build original ICS Calendar on all platforms
        run: pebble clean && pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: 7day-ics-all-day-verified
          path: build/*.pbw
          if-no-files-found: error
